<meta charset="UTF-8">

<title>Design your cover page by Priyanto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@500;700;800&family=Dancing+Script:wght@600&family=EB+Garamond:ital,wght@0,500;0,700;1,400&family=Great+Vibes&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Lora:ital,wght@0,400;0,700;1,400&family=Merriweather:wght@400;700&family=Montserrat:wght@400;600;700;800&family=Oswald:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,600&family=Poppins:wght@400;500;600;700&family=Raleway:wght@500;700;800&display=swap" rel="stylesheet">

<!-- ===================== CSS ===================== -->
<style>
  :root {
    --ui-bg: #0f172a;
    --ui-bar: #090d16;
    --ui-panel: #f8fafc;
    --ui-card: #ffffff;
    --ui-border: #cbd5e1;
    --ui-subtle: #e2e8f0;
    --ui-accent: #2563eb;
    --ui-accent-h: #1d4ed8;
    --ui-green: #059669;
    --ui-purple: #7c3aed;
    --ui-text: #0f172a;
    --ui-muted: #475569;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', 'Poppins', Arial, sans-serif;
    background: var(--ui-bg);
    color: var(--ui-text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Custom thin scrollbars */
  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.45); border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.7); }

  /* ---------- TOP STUDIO TOOLBAR ---------- */
  #bar {
    height: 58px;
    background: var(--ui-bar);
    color: #fff;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 8px;
    border-bottom: 1px solid #1e293b;
    flex-shrink: 0;
    z-index: 10;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-right: 6px;
  }
  .brand-icon {
    width: 30px;
    height: 30px;
    border-radius: 7px;
    background: linear-gradient(135deg, #2563eb, #6366f1);
    display: grid;
    place-items: center;
    font-size: 15px;
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
  }
  #bar h1 {
    font-size: 15px;
    font-weight: 700;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 7px;
    letter-spacing: 0.2px;
  }
  #bar h1 span.pro {
    font-size: 9.5px;
    font-weight: 700;
    background: linear-gradient(135deg, #2563eb, #8b5cf6);
    padding: 2px 7px;
    border-radius: 99px;
    letter-spacing: 0.9px;
    text-transform: uppercase;
  }

  .spacer { flex: 1; }

  .tgrp {
    display: flex;
    align-items: center;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 7px;
    padding: 2px;
    gap: 2px;
  }
  #zoomBadge {
    font-size: 11.5px;
    font-weight: 600;
    min-width: 42px;
    text-align: center;
    color: #cbd5e1;
    user-select: none;
  }

  .btn {
    border: 0;
    border-radius: 6px;
    padding: 8px 12px;
    font: 600 12px 'Inter', sans-serif;
    cursor: pointer;
    color: #fff;
    background: var(--ui-accent);
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    white-space: nowrap;
  }
  .btn:hover:not(:disabled) { background: var(--ui-accent-h); transform: translateY(-1px); }
  .btn:active:not(:disabled) { transform: translateY(0); }
  .btn:disabled { opacity: 0.38; cursor: not-allowed; }
  .btn.g { background: var(--ui-green); }
  .btn.g:hover:not(:disabled) { background: #047857; }
  .btn.n { background: #334155; }
  .btn.n:hover:not(:disabled) { background: #475569; }
  .btn.p { background: var(--ui-purple); }
  .btn.p:hover:not(:disabled) { background: #6d28d9; }
  .btn.ghost { background: transparent; padding: 5px 8px; color: #e2e8f0; }
  .btn.ghost:hover:not(:disabled) { background: #334155; transform: none; }
  .btn.sm { padding: 5px 9px; font-size: 11px; border-radius: 5px; }
  .btn.nanger { background: #dc2626; }
  .btn.nanger:hover:not(:disabled) { background: #b91c1c; }

  /* ---------- WORKSPACE ---------- */
  #main { flex: 1; display: flex; min-height: 0; }

  /* ---------- LEFT SIDEBAR ---------- */
  #panel {
    width: 425px;
    background: var(--ui-panel);
    display: flex;
    flex-direction: column;
    border-right: 1px solid #1e293b;
    flex-shrink: 0;
  }
  #tabs {
    display: flex;
    background: #e2e8f0;
    padding: 6px 6px 0;
    gap: 4px;
    border-bottom: 1px solid var(--ui-border);
  }
  #tabs button {
    flex: 1;
    border: 0;
    background: transparent;
    padding: 10px 4px;
    font: 600 12px 'Inter', sans-serif;
    cursor: pointer;
    color: var(--ui-muted);
    border-radius: 7px 7px 0 0;
    transition: 0.15s;
  }
  #tabs button:hover { color: var(--ui-text); background: rgba(255,255,255,0.55); }
  #tabs button.on {
    background: var(--ui-panel);
    color: var(--ui-accent);
    box-shadow: 0 -2.5px 0 var(--ui-accent) inset;
  }
  .sec { display: none; padding: 14px; overflow-y: auto; flex: 1; }
  .sec.on { display: block; }

  .card {
    background: var(--ui-card);
    border: 1px solid var(--ui-subtle);
    border-radius: 9px;
    padding: 13px;
    margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
  }
  h2 {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.85px;
    text-transform: uppercase;
    color: var(--ui-accent);
    margin: 0 0 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid #f1f5f9;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  label {
    display: block;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--ui-muted);
    margin: 8px 0 3px;
  }
  input[type=text], input[type=date], select, textarea {
    width: 100%;
    padding: 7.5px 9px;
    border: 1px solid var(--ui-border);
    border-radius: 6px;
    font: 12.5px 'Inter', sans-serif;
    background: #fff;
    color: var(--ui-text);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--ui-accent);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }
  input[type=file] {
    font-size: 11px;
    width: 100%;
    padding: 4px;
    border: 1px dashed var(--ui-border);
    border-radius: 6px;
    background: #f8fafc;
    cursor: pointer;
  }
  textarea { height: 58px; resize: vertical; }
  input[type=color] {
    width: 100%;
    height: 32px;
    border: 1px solid var(--ui-border);
    border-radius: 6px;
    padding: 2px;
    background: #fff;
    cursor: pointer;
  }
  input[type=range] { width: 100%; accent-color: var(--ui-accent); cursor: pointer; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; min-width: 0; }
  .chk {
    display: flex;
    align-items: center;
    gap: 7px;
    margin: 7px 0;
    font-size: 12px;
    color: #334155;
    cursor: pointer;
  }
  .chk input { width: 14.5px; height: 14.5px; accent-color: var(--ui-accent); cursor: pointer; }

  /* Template grid */
  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
  .chip {
    border: 1.5px solid var(--ui-border);
    background: #fff;
    border-radius: 7px;
    padding: 8px 4px;
    font: 600 11px 'Inter', sans-serif;
    color: #334155;
    cursor: pointer;
    transition: 0.15s;
    text-align: center;
  }
  .chip:hover { border-color: #94a3b8; background: #f1f5f9; }
  .chip.on {
    border-color: var(--ui-accent);
    color: var(--ui-accent);
    background: #eff6ff;
    box-shadow: 0 0 0 1px var(--ui-accent);
  }

  /* Color palettes */
  .pal { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 6px 0 8px; }
  .pal button {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px #cbd5e1;
    cursor: pointer;
    transition: transform 0.12s;
  }
  .pal button:hover { transform: scale(1.13); }

  /* Dynamic inputs */
  .dyn-row { display: flex; gap: 5px; margin-top: 6px; align-items: center; }
  .dyn-row input { padding: 6px 8px; font-size: 12px; }
  .dyn-del {
    border: 0;
    background: #fee2e2;
    color: #dc2626;
    border-radius: 5px;
    width: 26px;
    height: 29px;
    cursor: pointer;
    font-weight: 700;
    flex-shrink: 0;
    transition: 0.12s;
  }
  .dyn-del:hover { background: #fecaca; }

  .preset-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f1f5f9;
    border: 1px solid #e2e8f0;
    padding: 7px 10px;
    border-radius: 6px;
    margin-top: 6px;
    font-size: 12px;
    font-weight: 500;
  }

  /* Toast Notification */
  #toast {
    position: fixed;
    bottom: 20px;
    right: 22px;
    background: #0f172a;
    color: #f8fafc;
    border: 1px solid #334155;
    padding: 10px 16px;
    border-radius: 8px;
    font: 500 12.5px 'Inter', sans-serif;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    opacity: 0;
    transform: translateY(12px);
    pointer-events: none;
    transition: all 0.22s ease;
    z-index: 999;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #toast.show { opacity: 1; transform: translateY(0); }

  /* ---------- STAGE & PREVIEW ---------- */
  #stage {
    flex: 1;
    overflow: auto;
    padding: 28px;
    display: flex;
    background-image: radial-gradient(#334155 1px, transparent 1px);
    background-size: 20px 20px;
  }
  #scaler { transform-origin: top left; flex-shrink: 0; margin: 0 auto; }

  /* ================= THE A4 / LETTER PAGE ================= */
  #page {
    width: 794px;
    height: 1123px;
    position: relative;
    overflow: hidden;
    background: var(--bg);
    color: var(--tx);
    font-family: var(--bf);
    text-align: center;
    box-shadow: 0 20px 55px rgba(0,0,0,0.58);

    --p: #163264;
    --s: #c9a227;
    --tx: #111111;
    --bg: #ffffff;
    --bxbg: #eaf0f8;
    --bxbd: #163264;
    --ht: #ffffff;
    --bw: 3px;
    --bst: double;
    --rad: 0px;
    --fs: 1;
    --gap: 1;
    --pg: var(--p);
    --hf: Cinzel, serif;
    --bf: Poppins, sans-serif;
    --tc: var(--p);
    --ls: 125px;
    --us: 38;
    --ts: 42;
    --tw: 800;
    --tls: 0;
  }

  #page > div { position: absolute; }
  .bg, .bg2 { inset: 0; }
  .d { display: none; }
  .frame { pointer-events: none; z-index: 4; }
  .ph { opacity: 0.36; font-style: italic; }
  .exp .ph { visibility: hidden; }

  #wm {
    left: 0; right: 0; top: 50%;
    transform: translateY(-50%) rotate(-30deg);
    font: 800 115px var(--hf);
    color: var(--p);
    white-space: nowrap;
    text-align: center;
    pointer-events: none;
    z-index: 1;
  }

  .in {
    inset: 0;
    padding: 58px 62px 50px;
    display: flex;
    flex-direction: column;
    z-index: 2;
  }

  /* Logos */
  #logos {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-bottom: 10px;
  }
  #logos img {
    max-height: var(--ls);
    max-width: 240px;
    object-fit: contain;
    display: none;
  }
  #logos.circle img { border-radius: 50%; aspect-ratio: 1; object-fit: cover; }
  #logos.round img { border-radius: 14px; }

  #uni {
    font: 700 calc(var(--us) * 1px * var(--fs)) / 1.12 var(--hf);
    color: var(--p);
    letter-spacing: 1px;
  }
  #deptTop {
    font-size: calc(17px * var(--fs));
    font-weight: 600;
    margin-top: 5px;
    opacity: 0.9;
  }
  #loc {
    font-size: calc(16.5px * var(--fs));
    font-style: italic;
    margin-top: 5px;
  }

  /* Dividers */
  .rule {
    width: 135px;
    height: 4px;
    border-radius: 3px;
    background: var(--pg);
    margin: 20px auto 0;
    position: relative;
  }
  .rule.double {
    height: 6px;
    background: transparent;
    border-top: 2px solid var(--p);
    border-bottom: 2px solid var(--s);
    border-radius: 0;
  }
  .rule.diamond { height: 2px; width: 180px; background: var(--p); }
  .rule.diamond::after {
    content: "";
    position: absolute;
    width: 10px; height: 10px;
    background: var(--s);
    top: -4px; left: 50%; margin-left: -5px;
    transform: rotate(45deg);
  }
  .rule.dots {
    height: 6px; width: 90px;
    background: radial-gradient(circle, var(--s) 3px, transparent 3.5px) repeat-x center / 18px 6px;
  }

  /* Assignment Block */
  #mid { margin-top: calc(38px * var(--gap)); }
  #label {
    font-size: calc(20px * var(--fs));
    letter-spacing: 4.5px;
    text-transform: uppercase;
    color: var(--s);
    font-weight: 700;
  }
  #topic {
    font: var(--tw) calc(var(--ts) * 1px * var(--fs)) / 1.14 var(--hf);
    margin: 12px 0 12px;
    color: var(--tc);
    letter-spacing: calc(var(--tls) * 1px);
    overflow-wrap: break-word;
  }
  #subtopic {
    font-size: calc(17px * var(--fs));
    font-style: italic;
    opacity: 0.85;
    margin-bottom: 14px;
  }
  .course { font-size: calc(18px * var(--fs)); margin: 5px 0; }
  #ex .course { font-size: calc(15.5px * var(--fs)); opacity: 0.88; }

  /* Boxes */
  #boxes {
    display: flex;
    gap: 24px;
    margin-top: calc(32px * var(--gap));
    align-items: stretch;
  }
  .box {
    flex: 1;
    background: var(--bxbg);
    border: var(--bw) var(--bst) var(--bxbd);
    border-radius: var(--rad);
    padding: 20px 16px;
    font-size: calc(15.5px * var(--fs));
    line-height: 1.36;
    overflow-wrap: anywhere;
  }
  .box h3 {
    margin: 0 0 11px;
    font: 700 calc(18px * var(--fs)) var(--hf);
    color: var(--p);
    letter-spacing: 1.4px;
    text-transform: uppercase;
  }
  .r { margin: 6.5px 0; }
  .r small {
    display: block;
    font-size: 0.68em;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    opacity: 0.65;
  }
  .r b { font-weight: 600; }
  .two { display: flex; gap: 8px; }
  .two .r { flex: 1; }
  .mem { font-size: 0.9em; }

  .mem-tbl {
    width: 100%;
    border-collapse: collapse;
    margin-top: 5px;
    font-size: 0.86em;
  }
  .mem-tbl th, .mem-tbl td {
    border: 1px solid rgba(0,0,0,0.2);
    padding: 4px 6px;
    text-align: left;
  }
  .mem-tbl th { background: rgba(0,0,0,0.06); font-weight: 700; font-size: 0.85em; text-transform: uppercase; }

  /* Signature & Footer */
  #sign {
    display: none;
    justify-content: space-between;
    gap: 70px;
    margin-top: auto;
    margin-bottom: 24px;
    font-size: calc(13.5px * var(--fs));
    font-weight: 500;
  }
  #sign span { flex: 1; border-top: 1.8px solid var(--tx); padding-top: 6px; }
  #foot {
    margin-top: auto;
    border-top: 3px solid var(--p);
    padding-top: 11px;
    display: flex;
    justify-content: space-between;
    font-size: calc(16px * var(--fs));
    font-weight: 600;
  }
  [data-sg=on] #sign { display: flex; }
  [data-sg=on] #foot { margin-top: 0; }

  /* Box & Layout Variants */
  [data-bs=outline] .box { background: transparent; }
  [data-bs=card] .box { background: #fff; border-color: transparent; box-shadow: 0 8px 24px rgba(0,0,0,0.18); }
  [data-bs=accent] .box { border: 0; border-top: 7px solid var(--p); box-shadow: 0 3px 12px rgba(0,0,0,0.11); }
  [data-bs=glass] .box { background: rgba(255,255,255,0.78); backdrop-filter: blur(4px); }
  [data-bl=stack] #boxes { flex-direction: column; gap: 14px; }

  [data-al=left] { text-align: left; }
  [data-al=left] #logos { justify-content: flex-start; }
  [data-al=left] .rule { margin-left: 0; }
  [data-al=right] { text-align: right; }
  [data-al=right] #logos { justify-content: flex-end; }
  [data-al=right] .rule { margin-left: auto; margin-right: 0; }
  [data-al=left] .two, [data-al=right] .two { justify-content: flex-start; }

  /* ================= 12 TEMPLATES ================= */
  [data-t=band] .d1 { display: block; top: 0; left: 0; right: 0; height: 340px; background: var(--pg); }
  [data-t=band] .d2 { display: block; top: 340px; left: 0; right: 0; height: 8px; background: var(--s); }
  [data-t=band] #mid { margin-top: calc(62px * var(--gap)); }

  [data-t=diag] .d1 { display: block; top: 0; left: 0; right: 0; height: 405px; background: var(--s); clip-path: polygon(0 0, 100% 0, 100% 66%, 0 100%); }
  [data-t=diag] .d2 { display: block; top: 0; left: 0; right: 0; height: 380px; background: var(--pg); clip-path: polygon(0 0, 100% 0, 100% 62%, 0 100%); }
  [data-t=diag] #mid { margin-top: calc(76px * var(--gap)); }

  [data-t=arch] .d1 { display: block; top: -250px; left: -130px; right: -130px; height: 645px; border-radius: 50%; background: var(--s); }
  [data-t=arch] .d2 { display: block; top: -260px; left: -130px; right: -130px; height: 615px; border-radius: 50%; background: var(--pg); }
  [data-t=arch] #mid { margin-top: calc(60px * var(--gap)); }

  [data-t=split] .d1 { display: block; top: 0; left: 0; right: 0; height: 365px; background: var(--pg); clip-path: polygon(0 0, 100% 0, 100% 285px, 0 355px); }
  [data-t=split] .d2 { display: block; top: 0; left: 0; right: 0; height: 375px; background: var(--s); clip-path: polygon(0 355px, 100% 285px, 100% 295px, 0 365px); }
  [data-t=split] #mid { margin-top: calc(72px * var(--gap)); }

  [data-t=band] #uni, [data-t=band] #deptTop, [data-t=band] #loc,
  [data-t=diag] #uni, [data-t=diag] #deptTop, [data-t=diag] #loc,
  [data-t=arch] #uni, [data-t=arch] #deptTop, [data-t=arch] #loc,
  [data-t=split] #uni, [data-t=split] #deptTop, [data-t=split] #loc { color: var(--ht); }
  [data-t=band] .rule, [data-t=diag] .rule, [data-t=arch] .rule, [data-t=split] .rule { background: var(--s); }

  [data-t=ribbon] .d1 { display: block; top: 0; left: 56px; width: 92px; height: 240px; background: var(--pg); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 86%, 0 100%); }
  [data-t=ribbon] .d2 { display: block; top: 0; left: 0; right: 0; height: 9px; background: var(--s); }

  [data-t=side] .d1 { display: block; top: 0; left: 0; bottom: 0; width: 94px; background: var(--pg); }
  [data-t=side] .d2 { display: block; top: 0; left: 94px; bottom: 0; width: 7px; background: var(--s); }
  [data-t=side] .in { padding-left: 146px; }

  [data-t=geo] .d1 { display: block; width: 340px; height: 340px; border-radius: 50%; top: -150px; right: -110px; background: var(--pg); }
  [data-t=geo] .d2 { display: block; width: 300px; height: 300px; left: -150px; bottom: -150px; transform: rotate(45deg); background: var(--s); }
  [data-t=geo] .d3 { display: block; width: 88px; height: 88px; border-radius: 50%; top: 58px; left: 50px; border: 10px solid var(--s); }
  [data-t=geo] #foot { justify-content: flex-end; gap: 20px; }

  [data-t=min] .d1 { display: block; top: 0; left: 0; right: 0; height: 12px; background: var(--pg); }

  const lum = hex => {
    const n = parseInt(String(hex).slice(1), 16) || 0;
    const c = [16, 8, 0].map(sh => { const x = ((n >> sh) & 255) / 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  };
  const hsl = (h, s, l) => {
    h = ((h % 360) + 360) % 360; s = Math.max(0, Math.min(1, s)); l = Math.max(0, Math.min(1, l));
    const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
    const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))))).toString(16).padStart(2, '0');
    return '#' + f(0) + f(8) + f(4);
  };

    if (v('i_autofit')) {
      const inn = page.querySelector('.in');

      while (inn.scrollHeight > inn.clientHeight + 1 && k > 0.6 && guard++ < 16) {
        k -= 0.04;
        page.style.setProperty('--fs', (base * k).toFixed(3));
      }
    }
    const over = page.querySelector('.in').scrollHeight > page.querySelector('.in').clientHeight + 1;
    if (note) {
      note.classList.toggle('show', k < 1 || over);
      note.textContent = over ? '⚠ Content is still too long for one page — shorten some text or hide a section.' : (k < 1 ? `Text auto-shrunk to ${Math.round(k * 100)}% to fit the page.` : '');
    }
  }

  /* ---------- STATE, UNDO/REDO & PRESETS ---------- */
  const state = () => {
    const o = {
      v: {},
      L: { ...L },
      groupMembers: JSON.parse(JSON.stringify(groupMembers)),
      extraTo: JSON.parse(JSON.stringify(extraTo)),
      extraBy: JSON.parse(JSON.stringify(extraBy))
    };
    inputs.forEach(e => o.v[e.id] = e.type === 'checkbox' ? e.checked : e.value);
    return o;
  };

  function apply(o) {
    if (!o) return;
    inputs.forEach(e => {
      if (o.v && e.id in o.v) {
        if (e.type === 'checkbox') e.checked = o.v[e.id];
        else e.value = o.v[e.id];
      }
    });
    if (o.L) {
      L.logo = o.L.logo !== undefined ? o.L.logo : DEFAULT_LU_LOGO;
      L.logo2 = o.L.logo2 || '';
      L.bgimg = o.L.bgimg || '';
    }
    groupMembers = Array.isArray(o.groupMembers) && o.groupMembers.length ? o.groupMembers : [{ name: '', id: '' }];
    extraTo = Array.isArray(o.extraTo) ? o.extraTo : [];
    extraBy = Array.isArray(o.extraBy) ? o.extraBy : [];
    renderDynamicEditors();
  }

  function save() {
    try { localStorage.setItem('coverStudioPro_v4', JSON.stringify(state())); } catch (e) {}
  }

  function pushHistory() {
    const snap = JSON.stringify(state());
    if (snap === lastSnapshot) return;
    if (lastSnapshot) undoStack.push(lastSnapshot);
    if (undoStack.length > 35) undoStack.shift();
    redoStack = [];
    lastSnapshot = snap;
    updateHistoryBtns();
  }

  function scheduleHistory() {
    clearTimeout(historyTimer);
    historyTimer = setTimeout(pushHistory, 450);
  }

  function updateHistoryBtns() {
    $('bUndo').disabled = undoStack.length === 0;
    $('bRedo').disabled = redoStack.length === 0;
    $('bRndUndo').disabled = undoStack.length === 0;
  }

  $('bUndo').onclick = () => {
    if (!undoStack.length) return;
    redoStack.push(lastSnapshot);
    lastSnapshot = undoStack.pop();

  const ZOOM_STEPS = [0.5, 0.65, 0.75, 0.9, 1];
  function getCurrentScale() {
    const z = v('i_zoom');
    if (z === 'fit') {
      let sc = ($('stage').clientWidth - (innerWidth <= 920 ? 24 : 52)) / page.offsetWidth;
      if (document.body.classList.contains('pv')) sc = Math.min(sc, ($('stage').clientHeight - 24) / page.offsetHeight);
      return Math.max(0.2, Math.min(1, sc));
    }
    return +z;
  }

  window.fit = fit;
  function fit() {
    const w = page.offsetWidth;
    const h = page.offsetHeight;
    const z = v('i_zoom');
    const s = getCurrentScale();
    const sc = $('scaler');
    sc.style.transform = `scale(${s})`;
    sc.style.width = w * s + 'px';
    sc.style.height = h * s + 'px';
    $('zoomBadge').textContent = z === 'fit' ? 'Fit' : Math.round(s * 100) + '%';
  }

  $('bZoomIn').onclick = () => {
    const cur = getCurrentScale();
    const next = ZOOM_STEPS.find(x => x > cur + 0.02) || 1;
    $('i_zoom').value = String(next);
    fit();
  };
  $('bZoomOut').onclick = () => {
    const cur = getCurrentScale();
    const prev = [...ZOOM_STEPS].reverse().find(x => x < cur - 0.02) || 0.5;
    $('i_zoom').value = String(prev);
    fit();
  };
  $('bZoomFit').onclick = () => {
    $('i_zoom').value = 'fit';
    fit();
  };

      default: bg = '#ffffff'; tx = '#111111'; p = fitL(h, 0.62, bg, 8, -1, 0.28); s = fitL(h2, 0.72, bg, 3.2, -1, 0.5); bxbg = mix(p, 0.91);
    }
    return { name: MOOD_NAME[mood] + ' ' + hueName(h), p, s, bg, tx, bxbg, bxbd: p, ht: (contrast(mix(p, 0.16), '#ffffff') >= contrast(mix(p, 0.16), '#0b1220') ? '#ffffff' : '#0b1220'), gen: true };
  }
  const curated = i => { const t = THEMES[i]; return { name: t[0], p: t[1], s: t[2], bg: '#ffffff', tx: '#111111', bxbg: mix(t[1], 0.91), bxbd: t[1], ht: '#ffffff' }; };
  const applyPal = c => { ['p', 's', 'bg', 'tx', 'bxbg', 'bxbd', 'ht'].forEach(k => { $('i_' + k).value = c[k]; }); };

  /* --- helpers --- */
  let bag = [], lastRecipe = -1, lastTheme = -1;
  const setVals = o => { for (const k in o) { if (k === 'up') $('i_up').checked = !!o.up; else if (k === 'grad') $('i_grad').checked = !!o.grad; else if (RMAP[k]) $(RMAP[k]).value = o[k]; } };
  const doneRnd = (msg, silentName) => {
    render(); pushHistory(); notify(msg);
    const ls = $('lookSmall'); if (ls) ls.innerHTML = 'Current look: <span id="lookName">' + esc(silentName || msg.replace(/^✦\s*/, '')) + '</span>';
    page.classList.remove('pop'); void page.offsetWidth; page.classList.add('pop');
    setTimeout(() => page.classList.remove('pop'), 450);
    try { navigator.vibrate && navigator.vibrate(12); } catch (e) {}
  };
  const randomPalette = (r) => {
    if (Math.random() < 0.4 && r && r.th) { let k; do { k = rnd(r.th); } while (r.th.length > 1 && k === lastTheme); lastTheme = k; return curated(k); }
    if (Math.random() < 0.25) { let k; do { k = (Math.random() * THEMES.length) | 0; } while (k === lastTheme); lastTheme = k; return curated(k); }
    return genTheme(rnd((r && r.mo) || ALLM));
  };

  /* --- locks (keep colours / fonts / template while shuffling) --- */
  const LK = { lkCol: false, lkFont: false, lkTpl: false };
  try { Object.assign(LK, JSON.parse(localStorage.getItem('coverStudioPro_locks') || '{}')); } catch (e) {}
  Object.keys(LK).forEach(id => {
    const b = $(id); if (!b) return;
    b.setAttribute('aria-pressed', LK[id]);
    b.onclick = () => { LK[id] = !LK[id]; b.setAttribute('aria-pressed', LK[id]); try { localStorage.setItem('coverStudioPro_locks', JSON.stringify(LK)); } catch (e) {} notify((LK[id] ? '🔒 Kept: ' : '🔓 Free: ') + b.textContent.replace('🔒 ', '')); };
  });

  /* --- main Surprise Me --- */
  function surprise() {
    if (!bag.length) bag = RECIPES.map((_, i) => i).filter(i => i !== lastRecipe).sort(() => Math.random() - 0.5);
    lastRecipe = bag.pop();
    const r = RECIPES[lastRecipe];
    const o = { ...RD, ...r }; delete o.n; delete o.th; delete o.mo;
    if (r.pat === undefined && Math.random() < 0.3) { o.pat = rnd(['dots', 'grid', 'lines', 'cross']); o.pato = rnd([0.04, 0.05, 0.06, 0.08]); }
    if (r.al === undefined && Math.random() < 0.18) o.al = 'left';
    if (r.bl === undefined && Math.random() < 0.15) o.bl = 'stack';
    if (r.ls === undefined) o.ls = rnd(['none', 'round', 'circle', 'none']);
    if (r.fr === undefined && Math.random() < 0.2) { o.fr = rnd(['single', 'double', 'round']); }
    o.gap = rnd([0.95, 1, 1.05, 1.1]);
    o.gd = r.gd || rnd(['135deg', '180deg', '90deg']);
    o.grad = Math.random() > 0.25;
    if (LK.lkTpl) delete o.t;
    if (LK.lkFont) { delete o.hf; delete o.bf; o.us = RD.us; o.ts = RD.ts; }
    else if (!r.us && Math.random() < 0.25) { const pr = rnd(FONT_PAIRS); o.hf = pr[0]; o.bf = pr[1]; }
    let pal = null;
    if (!LK.lkCol) { pal = randomPalette(r); if (pal.gen && Math.random() < 0.12) o.tcm = 's'; }
    else o.tcm = 'p';
    setVals(o);
    if (pal) applyPal(pal);
    const nm = r.n + (pal ? ' · ' + pal.name : '');
    doneRnd('✦ ' + nm, nm);
  }
  $('bRnd').onclick = () => { $('bRnd').classList.remove('pulse'); surprise(); };

  /* --- partial shuffles --- */
  $('bRndTpl').onclick = () => { const t = TPL.filter(x => x[0] !== v('i_t')); const n = rnd(t); $('i_t').value = n[0]; doneRnd('Template: ' + n[1]); };
  $('bRndCol').onclick = () => { const pal = randomPalette(null); applyPal(pal); $('i_grad').checked = Math.random() > 0.25; $('i_gradDir').value = rnd(['135deg', '180deg', '90deg']); doneRnd('Colours: ' + pal.name); };
  $('bRndFont').onclick = () => { const cur = v('i_hf') + '|' + v('i_bf'); const pr = rnd(FONT_PAIRS.filter(x => x.join('|') !== cur)); $('i_hf').value = pr[0]; $('i_bf').value = pr[1]; $('i_us').value = RD.us; $('i_ts').value = RD.ts; doneRnd('Fonts shuffled'); };
  $('bRndLay').onclick = () => { setVals(rnd(STYLES)); doneRnd('Style shuffled'); };
  $('bRndAlign').onclick = () => { setVals({ al: rnd(['center', 'center', 'left']), bl: rnd(['row', 'row', 'stack']), ls: rnd(['none', 'round', 'circle']), lsz: rnd([110, 125, 140]), gap: rnd([0.95, 1, 1.05, 1.1]) }); doneRnd('Layout shuffled'); };
  $('bRndUndo').onclick = () => $('bUndo').click();

  const MOOD_BG = { classic: 'linear-gradient(135deg,#163264,#c9a227)', bold: 'linear-gradient(135deg,#1d4ed8,#f97316)', paper: 'linear-gradient(135deg,#7c5c3a,#f3e6c8)', pastel: 'linear-gradient(135deg,#f9a8d4,#a5b4fc)', dark: 'linear-gradient(135deg,#0f172a,#38bdf8)', neon: 'linear-gradient(135deg,#0b0b12,#e11dff 55%,#22d3ee)', earth: 'linear-gradient(135deg,#5b3a1e,#a3b18a)', mono: 'linear-gradient(135deg,#111827,#9ca3af)' };
  $('moods').innerHTML = ALLM.map(m => `<button type="button" class="mood${m === 'paper' || m === 'pastel' ? ' light' : ''}" data-m="${m}" style="background:${MOOD_BG[m]}">${MOOD_NAME[m]}</button>`).join('') + '<button type="button" class="mood" data-m="any" style="background:conic-gradient(#ef4444,#f59e0b,#22c55e,#3b82f6,#a855f7,#ef4444)">🎲 Any</button>';
  $('moods').onclick = e => {
    const b = e.target.closest('.mood'); if (!b) return;
    const m = b.dataset.m === 'any' ? rnd(ALLM) : b.dataset.m;
    const pal = genTheme(m); applyPal(pal); doneRnd(pal.name + ' theme', pal.name);
  };
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const tg = (document.activeElement && document.activeElement.tagName) || '';
    if (/INPUT|TEXTAREA|SELECT|BUTTON/.test(tg)) return;
    if (e.key === 'r' || e.key === 'R') { e.preventDefault(); $('bRnd').click(); }
  });

  // native share sheet (save to Photos / send on WhatsApp etc.)
  if (navigator.canShare && navigator.share) {
    $('bShare').style.display = '';
    $('bShare').onclick = async () => {
      if (noLibs()) return;
      const btn = $('bShare'), old = btn.innerHTML;
      btn.textContent = '⏳'; btn.disabled = true;
      try {
        const c = await capture();
        const blob = await new Promise(r => c.toBlob(r, 'image/png'));
        const file = new File([blob], (v('i_fn').trim() || 'Assignment-Cover') + '.png', { type: 'image/png' });
        if (navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: 'Cover page' });
        else notify('Sharing not supported here — use PNG');
      } catch (err) { if (!err || err.name !== 'AbortError') notify('⚠️ Share failed — try PNG'); }
      finally { btn.innerHTML = old; btn.disabled = false; }
    };
  }

  render();
  renderPresets();
  lastSnapshot = JSON.stringify(state());
})();
</script>
</body>
</html>
